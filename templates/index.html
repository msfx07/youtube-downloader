<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316213e'/><path d='M16 6v12M10 13l6 7 6-7' stroke='%23e94560' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/><line x1='9' y1='25' x2='23' y2='25' stroke='%23e94560' stroke-width='3' stroke-linecap='round'/></svg>">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script async src="https://analytics.sandbox99.cc/static/analitika.js"
        integrity="sha384-mnz0dhG6vmDZhkVRfEhJ8zUruNJRGwgFTRsufJD1J5xFdMuiW6HcJMil6G1Q7Ecu"
        crossorigin="anonymous"></script>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h1>YouTube Downloader</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">&#9728;</button>
    </div>
    <form id="dlForm">
        <div>
            <label for="url">YouTube URL</label>
            <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>
        <div class="row">
            <div>
                <label for="resolution">Resolution</label>
                <select id="resolution">
                    <option value="best">best</option>
                    <option value="1080p">1080p</option>
                    <option value="720p">720p</option>
                    <option value="480p">480p</option>
                </select>
            </div>
            <div>
                <label for="format">Format</label>
                <select id="format">
                    <option value="mp4">mp4</option>
                    <option value="mkv">mkv</option>
                    <option value="webm">webm</option>
                </select>
            </div>
        </div>
        <div>
            <label for="audioOnly">Audio only</label>
            <select id="audioOnly">
                <option value="">off</option>
                <option value="mp3">mp3</option>
                <option value="m4a">m4a</option>
                <option value="opus">opus</option>
            </select>
        </div>
        <button type="submit" id="dlBtn">Download</button>
    </form>
    <div class="progress-section" id="progressSection">
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Starting...</div>
        <div class="filename" id="filenameText"></div>
        <div class="error-msg" id="errorMsg"></div>
        <button id="saveBtn">Save File</button>
        <button id="cancelBtn">Cancel</button>
        <button id="clearBtn">Clear</button>
    </div>
    <div class="footer">
        5 downloads/hour &middot; files auto-delete after save<br>
        <a href="https://ytd.sandbox99.cc/policy">fair use policy</a> &middot; <a href="https://github.com/msfx07/youtube-downloader" target="_blank" rel="noopener">host your own</a>
    </div>
</div>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
